  <script>
    // Telefonda arayüz %80 ölçekte: sayfa daha geniş çizilip ekrana sığdırılır (Amar'daki yoğunluk).
    // Ölçek sabit: dokunurken / yazı kutusuna odaklanınca iOS yakınlaştırmasın.
    (function () {
      var UI_SCALE = 0.8, sw = Math.min(screen.width, screen.height);
      if (sw >= 600) return;
      var w = Math.round(sw / UI_SCALE), s = (sw / w).toFixed(4);
      document.querySelector('meta[name=viewport]').setAttribute('content',
        'width=' + w + ', initial-scale=' + s + ', minimum-scale=' + s + ', maximum-scale=' + s + ', user-scalable=no, viewport-fit=cover');
    })();
  </script>
